name: "Setup Dev CI ⚡"
description: "Setup [checkout, JDK, Maven build, Sonar]"

inputs:
  sonar_projectKey:
    required: true
    description: The project key in sonar cloud
  sonar_token:
    required: true
    description: Sonar token
  maven_args_ubuntu:
    default: '-B -ntp -Pjacoco install'
    description: Maven arguments on Ubuntu
  maven_args_windows:
    default: '-B -ntp verify'
    description: Maven arguments on Windows
  maven_args_macos:
    default: '-B -ntp verify'
    description: Maven arguments on macOS

runs:
  using: "composite"
  steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Build with Maven (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        read -r -a maven_args <<< "$MAVEN_ARGS"
        ./mvnw "${maven_args[@]}"
      shell: bash
      env:
        MAVEN_ARGS: ${{ inputs.maven_args_ubuntu }}

    - name: Build with Maven (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $mavenArgs = $env:MAVEN_ARGS.Trim() -split '\s+'
        & .\mvnw.cmd @mavenArgs
        exit $LASTEXITCODE
      shell: pwsh
      env:
        MAVEN_ARGS: ${{ inputs.maven_args_windows }}

    - name: Build with Maven (MacOS)
      if: matrix.os == 'macos-latest'
      run: |
        read -r -a maven_args <<< "$MAVEN_ARGS"
        ./mvnw "${maven_args[@]}"
      shell: bash
      env:
        MAVEN_ARGS: ${{ inputs.maven_args_macos }}

    - name: Run SonarCloud analysis
      if: matrix.os == 'ubuntu-latest'
      run: >
        ./mvnw -B -ntp -DskipTests sonar:sonar
        -Dsonar.host.url=https://sonarcloud.io
        -Dsonar.organization=powsybl-ci-github
        "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
      env:
        SONAR_TOKEN: ${{ inputs.sonar_token }}
        SONAR_PROJECT_KEY: ${{ inputs.sonar_projectKey }}
      shell: bash