name: "Setup Java Maven"
description: "Setup java maven workflow test"

inputs:
  maven-args:
    description: "Maven args TODO (for each os there is different args)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Checkout sources
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up JDK 21
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Build with Maven (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: echo "Running maven build on ubuntu"
      shell: bash
      # run: ./mvnw -B -ntp -Dpowsybl.docker-unit-tests.skip=false -Pjacoco install # specific to core.

    - name: Build with Maven (Windows)
      if: matrix.os == 'windows-latest'
      run: echo "Running maven build on windows"
      shell: bash
      # run: mvnw.cmd -B -ntp verify -Dpowsybl.checks.skip=true # specific to core.
      # shell: cmd
      
    - name: Build with Maven (MacOS)
      if: matrix.os == 'macos-latest'
      run: echo "Running maven build on macos"
      shell: bash
      # run: ./mvnw -B -ntp verify -Dpowsybl.checks.skip=true # specific to core.