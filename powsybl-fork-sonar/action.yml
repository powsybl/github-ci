name: "Setup Fork CI - Sonar analysis"
description: "Run the Sonar analysis of a PR coming from a fork, from the data produced by powsybl-fork-build"

# To be used in a workflow triggered by `workflow_run` (privileged: has access to secrets).
# SECURITY: the code coming from the fork must NEVER be executed here (no Maven, no scripts of the PR).
# Everything coming from the fork (sources, artifact) is treated as untrusted data.

inputs:
  sonar_projectKey:
    required: true
    description: The project key in sonar cloud
  sonar_token:
    required: true
    description: Sonar token
  distribution_module:
    default: '.'
    description: Module (relative to working_directory) where dependencies and the aggregated Jacoco report are regrouped (e.g. distribution-core). Keep the default '.' for a single-module project
  working_directory:
    default: '.'
    description: Directory containing the Maven project (same value as in powsybl-fork-build)
  java_version:
    default: '21'
    description: Java version used to run the scanner

runs:
  using: "composite"
  steps:
    - name: Resolve PR information
      id: pr
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          const run = context.payload.workflow_run;
          if (!run) {
            core.setFailed("❌ This action must be used in a workflow triggered by workflow_run");
            return;
          }
          if (run.event !== 'pull_request' || run.conclusion !== 'success') {
            core.setFailed(`❌ Unexpected triggering run (event=${run.event}, conclusion=${run.conclusion})`);
            return;
          }
          if (!run.head_repository || run.head_repository.full_name === `${context.repo.owner}/${context.repo.repo}`) {
            core.setFailed("❌ This action is only for pull requests coming from forks");
            return;
          }
          const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: run.head_sha,
          });
          const pr = prs.find(p => p.state === 'open'
            && p.head.sha === run.head_sha
            && p.head.repo && p.head.repo.full_name === run.head_repository.full_name);
          if (!pr) {
            core.setFailed("❌ No open PR found for " + run.head_sha);
            return;
          }
          const safeRef = /^[A-Za-z0-9._\/-]+$/;
          if (!safeRef.test(pr.head.ref) || !safeRef.test(pr.base.ref)) {
            core.setFailed("❌ Unexpected branch name");
            return;
          }
          core.setOutput('number', String(pr.number));
          core.setOutput('head_ref', pr.head.ref);
          core.setOutput('base_ref', pr.base.ref);
          core.setOutput('head_sha', run.head_sha);
          core.setOutput('head_repo', run.head_repository.full_name);

    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.pr.outputs.head_repo }}
        ref: ${{ steps.pr.outputs.head_sha }}
        fetch-depth: 0
        persist-credentials: false

    # No Maven cache: nothing is built here, and the cache must not be shared with unprivileged builds.
    - name: Set up JDK
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java_version }}

    - name: Download artifact
      id: download
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        TARGET_DIR: ${{ runner.temp }}/artifacts
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          // The name is built from the PR number resolved above, not parsed from untrusted data.
          const name = `data-for-sonar-analysis-${process.env.PR_NUMBER}`;
          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.payload.workflow_run.id,
          });
          const matchArtifact = artifacts.find(a => a.name === name);
          if (!matchArtifact) {
            core.setFailed(`❌ Artifact ${name} not found`);
            return;
          }
          core.setOutput('name', name);
          const download = await github.rest.actions.downloadArtifact({
            owner: context.repo.owner,
            repo: context.repo.repo,
            artifact_id: matchArtifact.id,
            archive_format: 'zip',
          });
          fs.mkdirSync(process.env.TARGET_DIR, { recursive: true });
          fs.writeFileSync(path.join(process.env.TARGET_DIR, 'sonar-data.zip'), Buffer.from(download.data));

    - name: Prepare Sonar analysis
      id: prepare
      working-directory: ${{ inputs.working_directory }}
      env:
        DIST_MODULE: ${{ inputs.distribution_module }}
        ARTIFACTS: ${{ runner.temp }}/artifacts
        EXTRACTED: ${{ runner.temp }}/extracted
      run: |
        set -euo pipefail
        SAFE='^[A-Za-z0-9._/+@-]+$'
        find . -not -path './.git/*' -type l -delete
        find . \( -name 'sonar-project.properties' -o -name '.sonarcloud.properties' \) -type f -delete
        mkdir -p "$EXTRACTED"
        unzip -q "$ARTIFACTS/sonar-data.zip" -d "$EXTRACTED"
        find "$EXTRACTED" -type l -delete
        find "$EXTRACTED" -type f -not \( -path '*/target/classes/*' -o -path '*/target/generated-sources/*' \
          -o -path '*/target/dependency/*' -o -path '*/target/site/jacoco-aggregate/jacoco.xml' \
          -o -path '*/target/site/jacoco/jacoco.xml' \) -delete
        PROJECT_DIR="$PWD"
        (cd "$EXTRACTED" && find . -type f -print0 | xargs -0 -r cp --parents -t "$PROJECT_DIR")
        list() {
          local out="" d
          while IFS= read -r d; do
            d="${d#./}"
            if [[ "$d" =~ $SAFE ]]; then
              out+="${out:+,}$d"
            else
              echo "::warning::Ignoring unsafe path" >&2
            fi
          done < <(find . -name node_modules -prune -o -type d "$@" -print | sort -u)
          echo "$out"
        }
        SOURCES=$(list -path '*/main/java' -not -path '*/target/*')
        GENERATED=$(list -path '*/target/generated-sources')
        TESTS=$(list -path '*/test/java' -not -path '*/target/*')
        BINARIES=$(list -path '*/target/classes')
        [ -n "$SOURCES" ] || { echo "::error::No source directories found"; exit 1; }
        [ -n "$BINARIES" ] || { echo "::error::No binaries directories found"; exit 1; }
        LIBRARIES=""
        if [ -d "$DIST_MODULE/target/dependency" ] && [[ "$DIST_MODULE/target/dependency" =~ $SAFE ]]; then
          LIBRARIES="$DIST_MODULE/target/dependency"
        else
          echo "::warning::Libraries directory not found"
        fi
        JACOCO=""
        if [[ "$DIST_MODULE" =~ $SAFE ]]; then
          for CANDIDATE in "$DIST_MODULE/target/site/jacoco-aggregate/jacoco.xml" "$DIST_MODULE/target/site/jacoco/jacoco.xml"; do
            if [ -f "$CANDIDATE" ]; then
              JACOCO="$CANDIDATE"
              break
            fi
          done
        fi
        [ -n "$JACOCO" ] || echo "::warning::Jacoco report not found"
        {
          echo "sources=$SOURCES"
          echo "generated=$GENERATED"
          echo "tests=$TESTS"
          echo "binaries=$BINARIES"
          echo "libraries=$LIBRARIES"
          echo "jacoco=$JACOCO"
        } >> "$GITHUB_OUTPUT"
      shell: bash

    # This sonar action should NOT be replaced by a direct use of the mvn verify command since we don't want external
    # code to run in a workflow_run workflow (it may lead to security issues).
    # All interpolated values below are either validated (paths, refs) or resolved from the GitHub API (PR data).
    - name: Run Sonar Analysis
      uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RUNGHA_SONAR_PROJECT_KEY: ${{ inputs.sonar_projectKey }}
        SONAR_TOKEN: ${{ inputs.sonar_token }}
      with:
        projectBaseDir: ${{ inputs.working_directory }}
        args: >
          "-Dsonar.projectKey=$RUNGHA_SONAR_PROJECT_KEY"
          -Dsonar.organization=powsybl-ci-github
          "-Dsonar.sources=${{ steps.prepare.outputs.sources }}"
          "-Dsonar.generatedSources=${{ steps.prepare.outputs.generated }}"
          "-Dsonar.tests=${{ steps.prepare.outputs.tests }}"
          "-Dsonar.java.binaries=${{ steps.prepare.outputs.binaries }}"
          "-Dsonar.java.libraries=${{ steps.prepare.outputs.libraries }}"
          "-Dsonar.java.test.libraries=${{ steps.prepare.outputs.libraries }}"
          "-Dsonar.coverage.jacoco.xmlReportPaths=${{ steps.prepare.outputs.jacoco }}"
          "-Dsonar.pullrequest.key=${{ steps.pr.outputs.number }}"
          "-Dsonar.pullrequest.branch=${{ steps.pr.outputs.head_ref }}"
          "-Dsonar.pullrequest.base=${{ steps.pr.outputs.base_ref }}"
          -Dsonar.pullrequest.provider=github
          -Dsonar.pullrequest.github.repository=${{ github.repository }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.scm.provider=git
          -Dsonar.qualitygate.wait=true
          -Dsonar.scm.revision=${{ steps.pr.outputs.head_sha }}

    - name: Delete artifact used in analysis
      if: always() && steps.download.outputs.name != ''
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        ARTIFACT_NAME: ${{ steps.download.outputs.name }}
      with:
        script: |
          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.payload.workflow_run.id,
          });
          for (const artifact of artifacts.filter(a => a.name === process.env.ARTIFACT_NAME)) {
            console.log(`Deleting artifact: ${artifact.name} (ID: ${artifact.id})`);
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id
            });
          }
